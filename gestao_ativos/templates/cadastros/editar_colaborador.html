{% extends "base.html" %}

{% block conteudo %}
<div class="topbar">
    <div>
        <h1 style="margin:0;">Editar colaborador</h1>
        <div class="muted">Atualize as informações do colaborador</div>
    </div>
</div>
<div class="card">
    <form method="post">
        <label>Nome</label>
        <input name="nome" value="{{ item.nome }}" required>
        <label style="margin-top:12px;">E-mail</label>
        <input name="email" value="{{ item.email or '' }}">
        <div class="actions" style="margin-top:12px;">
            <button type="submit">Salvar alterações</button>
            <a class="btn btn-secondary" href="{{ url_for('cadastros') }}">Voltar</a>
        </div>
    </form>
</div>
{% endblock %}
